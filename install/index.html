<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Stag Menu</title>
  <meta name="description" content="Add the Stag & Stone menu web app to your home screen." />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#101112" />
  <meta name="application-name" content="Stag Menu" />
  <meta name="apple-mobile-web-app-title" content="Stag Menu" />

  <link rel="manifest" href="../manifest.webmanifest?v=20261005-3" />
  <link rel="icon" type="image/png" sizes="512x512" href="../Assets/menu-icon-512.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="../Assets/menu-icon-180.png?v=2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --ink:#f3eadf;
      --muted:#b8afa4;
      --copper:#c88b59;
      --line:rgba(225,177,127,.28);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
      color:var(--ink);
      font-family:Cardo,Georgia,serif;
      background:
        linear-gradient(rgba(7,8,9,.42),rgba(7,8,9,.62)),
        url("https://stagandstonecoffee.com/assets/menu-page-bg.webp") center top/cover fixed no-repeat,
        #101112;
    }

    .install-shell{width:min(100%,460px)}

    .install-card{
      position:relative;
      overflow:hidden;
      padding:30px 24px 24px;
      border:1px solid var(--line);
      border-radius:24px;
      background-color:#101112;
      background-image:url("https://stagandstonecoffee.com/assets/menu-charcoal-texture.webp");
      background-size:520px auto;
      background-repeat:repeat;
      background-position:center;
      box-shadow:0 24px 64px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.025);
      text-align:center;
    }

    .install-card::before,
    .install-card::after{
      content:"❦";
      position:absolute;
      color:rgba(200,139,89,.12);
      font-size:5.5rem;
      line-height:1;
      pointer-events:none;
    }

    .install-card::before{left:-18px;bottom:-22px;transform:rotate(-15deg)}
    .install-card::after{right:-14px;top:-28px;transform:rotate(165deg)}

    .eyebrow{
      margin:0 0 10px;
      color:var(--copper);
      font-family:Cinzel,serif;
      font-size:.67rem;
      font-weight:700;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    h1{
      margin:0 0 14px;
      font-family:Cinzel,serif;
      font-size:clamp(1.7rem,7vw,2.35rem);
      font-weight:600;
      line-height:1.12;
      letter-spacing:.035em;
      text-transform:uppercase;
    }

    .install-copy{
      max-width:34ch;
      margin:0 auto 24px;
      color:var(--muted);
      font-size:.98rem;
      line-height:1.55;
    }

    .install-button,
    .ios-help-close{
      width:100%;
      min-height:54px;
      padding:14px 20px;
      border:1px solid rgba(255,220,185,.24);
      border-radius:15px;
      background:
        linear-gradient(rgba(52,22,9,.08),rgba(24,10,4,.18)),
        url("../Assets/stag-menu-copper-texture.webp") center/cover no-repeat;
      color:#fff3e6;
      font-family:Cinzel,serif;
      font-size:.72rem;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      text-shadow:0 1px 2px rgba(0,0,0,.58);
      box-shadow:inset 0 1px rgba(255,255,255,.1),inset 0 -2px rgba(0,0,0,.3),0 9px 22px rgba(0,0,0,.28);
      cursor:pointer;
    }

    .install-button:disabled{opacity:.5;cursor:default}

    .status{
      min-height:1.4em;
      margin:14px 0 0;
      color:var(--muted);
      font-size:.8rem;
      line-height:1.45;
    }

    .home-link{
      display:inline-block;
      margin-top:18px;
      color:rgba(255,243,230,.88);
      font-family:Cinzel,serif;
      font-size:.65rem;
      letter-spacing:.07em;
      text-decoration:none;
      text-transform:uppercase;
    }

    .ios-help-overlay{
      position:fixed;
      z-index:30;
      inset:0;
      display:grid;
      place-items:center;
      padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
      background:rgba(5,6,7,.82);
    }

    .ios-help-card{
      width:min(100%,430px);
      padding:26px 22px 22px;
      border:1px solid var(--line);
      border-radius:22px;
      background-color:#101112;
      background-image:url("https://stagandstonecoffee.com/assets/menu-charcoal-texture.webp");
      background-size:460px auto;
      color:var(--ink);
      box-shadow:0 24px 64px rgba(0,0,0,.5);
    }

    .ios-help-card h2{
      margin:0 0 14px;
      font-family:Cinzel,serif;
      font-size:1.45rem;
      line-height:1.2;
      text-transform:uppercase;
    }

    .ios-help-card ol{margin:0 0 18px;padding-left:22px;line-height:1.55}
    .ios-help-card li+li{margin-top:8px}
    .share-icon{
      display:inline-flex;
      width:1.15em;
      height:1.15em;
      margin:0 .12em;
      vertical-align:-.18em;
      color:currentColor;
    }
    .share-icon svg{
      width:100%;
      height:100%;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .ios-help-tip{margin:0 0 20px;color:var(--muted);font-size:.84rem;line-height:1.5}
  </style>
</head>

<body>
  <main class="install-shell">
    <section class="install-card" aria-labelledby="installTitle">
      <p class="eyebrow">Stag &amp; Stone</p>
      <h1 id="installTitle">Add the menu to your home screen</h1>
      <p class="install-copy">Keep the Stag &amp; Stone menu one tap away in its own phone-first web app.</p>

      <button id="installButton" class="install-button" type="button" disabled>
        Preparing install...
      </button>

      <p id="installStatus" class="status" role="status" aria-live="polite">
        Preparing the best install option for this device.
      </p>
    </section>

    <div style="text-align:center">
      <a class="home-link" href="https://stagandstonecoffee.com/menu.html">Back to the menu</a>
    </div>
  </main>

  <script>
    (function(){
      const installButton=document.getElementById("installButton");
      const installStatus=document.getElementById("installStatus");
      const ua=navigator.userAgent||"";
      const isAndroid=/Android/i.test(ua);
      const isIOS=/iPad|iPhone|iPod/i.test(ua);
      const isFirefoxIOS=/FxiOS/i.test(ua);
      const isStandalone=
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone===true;

      const params=new URLSearchParams(window.location.search);
      const freshInstallRequest=params.get("from")==="menu";

      let deferredPrompt=null;

      if("serviceWorker" in navigator){
        window.addEventListener("load",()=>{
          navigator.serviceWorker.register("../service-worker.js").catch(()=>{});
        });
      }

      function showReadyState(){
        installButton.disabled=false;
        installButton.textContent="Install Stag & Stone";
        installStatus.textContent="Tap once. Your browser will handle the rest.";
      }

      function showManualAndroidHelp(){
        installButton.disabled=false;
        installButton.textContent="How to install";
        installStatus.textContent="Chrome has not offered the install yet.";
      }

      if(isStandalone && !freshInstallRequest){
        installButton.hidden=true;
        installStatus.textContent="Stag & Stone is already installed on this device.";
        return;
      }

      if(isIOS){
        installButton.disabled=false;
        installButton.textContent="Show me how";
        installStatus.textContent=
          isFirefoxIOS
            ? "Firefox can add Stag & Stone from the Share menu."
            : "Use your browser's Share menu to add Stag & Stone.";
      }else if(!isAndroid){
        installButton.disabled=false;
        installButton.textContent="How to add Stag & Stone";
        installStatus.textContent="Use your browser's install or Add to Home Screen option.";
      }

      window.addEventListener("beforeinstallprompt",event=>{
        event.preventDefault();
        deferredPrompt=event;
        showReadyState();
      });

      window.addEventListener("appinstalled",()=>{
        deferredPrompt=null;
        installButton.hidden=true;
        installStatus.textContent="Stag & Stone is installed. Look for the icon on your home screen.";
      });

      installButton.addEventListener("click",async()=>{
        if(deferredPrompt){
          try{
            deferredPrompt.prompt();
            const choice=await deferredPrompt.userChoice;
            installStatus.textContent=
              choice&&choice.outcome==="accepted"
                ? "Installing Stag & Stone..."
                : "No problem. Tap Install Stag & Stone whenever you're ready.";
          }catch(error){
            showManualAndroidHelp();
          }finally{
            deferredPrompt=null;
          }
          return;
        }

        if(isAndroid){
          installStatus.innerHTML=
            'In Chrome, tap <strong>⋮</strong>, then <strong>Install app</strong> or <strong>Add to Home screen</strong>.';
          return;
        }

        if(isIOS){
          const overlay=document.createElement("div");
          overlay.className="ios-help-overlay";
          overlay.innerHTML=`
            <section class="ios-help-card" role="dialog" aria-modal="true" aria-labelledby="iosHelpTitle">
              <h2 id="iosHelpTitle">Add Stag & Stone to your Home Screen</h2>
              <ol>
                <li>
                  Tap the
                  <span class="share-icon" role="img" aria-label="Share">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 15V3"></path>
                      <path d="M8.5 6.5 12 3l3.5 3.5"></path>
                      <path d="M7 10H5.5A2.5 2.5 0 0 0 3 12.5v6A2.5 2.5 0 0 0 5.5 21h13a2.5 2.5 0 0 0 2.5-2.5v-6A2.5 2.5 0 0 0 18.5 10H17"></path>
                    </svg>
                  </span>
                  button in your browser toolbar.
                </li>
                <li>Scroll and tap <strong>Add to Home Screen</strong>.</li>
                <li>Tap <strong>Add</strong>.</li>
              </ol>
              <p class="ios-help-tip">
                Once added, Stag Menu opens from your Home Screen like its own app.
              </p>
              <button type="button" class="ios-help-close">Got it</button>
            </section>
          `;

          document.body.appendChild(overlay);

          const closeButton=overlay.querySelector(".ios-help-close");
          closeButton.addEventListener("click",()=>overlay.remove());
          overlay.addEventListener("click",event=>{
            if(event.target===overlay) overlay.remove();
          });
          closeButton.focus();
          return;
        }

        installStatus.innerHTML=
          'Open your browser menu and choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.';
      });

      if(isAndroid){
        window.setTimeout(()=>{
          if(!deferredPrompt) showManualAndroidHelp();
        },3500);
      }
    })();
  </script>
</body>
</html>
